<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Predaja vozila</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--tx:#000;--sec:#6c6c70;--sep:#d1d1d6;--fill:rgba(118,118,128,.12);--segsel:#fff;--blue:#007aff;--ok:#34c759;--bad:#ff3b30;--bar:rgba(242,242,247,.82)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--sec:#98989f;--sep:#38383a;--fill:rgba(118,118,128,.24);--segsel:#636366;--blue:#0a84ff;--ok:#30d158;--bad:#ff453a;--bar:rgba(0,0,0,.78)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto}
header{padding:calc(28px + env(safe-area-inset-top)) 20px 4px}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
#sub{margin-top:4px;font-size:17px;color:var(--sec)}
main{padding:0 16px}
.sec{color:var(--sec)}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 16px 8px;font-size:13px;color:var(--sec)}
.gh button{background:none;border:0;padding:8px 0;margin:-8px 0;min-height:0;font-size:15px;color:var(--blue)}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.grp>*{position:relative}
.grp>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px}
.cell>span{flex:none}
.cell input,.cell select{flex:1;min-width:0;min-height:50px;margin:0;padding:0;border:0;background:transparent;color:var(--sec);font:inherit;text-align:right;text-align-last:right;-webkit-appearance:none;appearance:none;border-radius:0}
.cell select{padding-right:20px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23aeaeb2' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right center}
input::placeholder,textarea::placeholder{color:#aeaeb2}
input[type=number]{-moz-appearance:textfield}
input::-webkit-inner-spin-button{display:none}
.blk{padding:12px 16px 14px}
.lb{margin-bottom:8px;font-size:13px;color:var(--sec)}
.seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:9px}
.seg label{position:relative;flex:1 1 0;min-width:0}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.seg span{display:block;padding:10px 2px;text-align:center;font-size:14px;border-radius:7px;transition:background .15s}
.seg input:checked+span{background:var(--segsel);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
.nm::before{content:"";display:inline-block;width:8px;height:8px;margin-right:12px;border-radius:50%;background:var(--ok);vertical-align:1px}
.row.bad .nm::before{background:var(--bad)}
.row.bad select{color:var(--bad);font-weight:600}
textarea{display:block;width:100%;min-height:96px;padding:14px 16px;border:0;background:transparent;color:var(--tx);font:inherit;resize:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.note{margin:12px 16px 0;font-size:13px;text-align:center;color:var(--sec)}
.bar{position:sticky;bottom:0;margin:24px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.btn:active{opacity:.8}
.done{padding:72px 24px 0;text-align:center}
.ck{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:72px}
.done h2{margin:0 0 8px;font-size:24px;letter-spacing:-.02em}
.done p{margin:4px 0}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:22px;background:rgba(44,44,46,.94);color:#fff;font-size:15px;text-align:center;display:none;z-index:9;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#toast.err{background:rgba(255,59,48,.96)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1 id="t"></h1><div id="sub"></div></header>
<main id="app"></main>
</div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const C=CONFIG,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],q=new URLSearchParams(location.search);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
const grp=(h,b,a)=>`<div class=gh><span>${h}</span>${a||''}</div><div class=grp>${b}</div>`;
const sel=(id,l,a,s,ph)=>`<label class=cell><span>${l}</span><select id=${id}>${ph?'<option value="">Izberi</option>':''}${opt(a,s)}</select></label>`;
const seg=(l,n,a,d)=>`<div class=blk><div class=lb>${l}</div><div class=seg>${a.map(x=>`<label><input type=radio name=${n} value="${esc(x)}"${x===d?' checked':''}><span>${esc(x)}</span></label>`).join('')}</div></div>`;
const rows=(g,a,st)=>a.map(x=>`<div class="cell row"><span class=nm>${esc(x)}</span><select data-g=${g} data-n="${esc(x)}">${opt(st)}</select></div>`).join('');
const sect=(g,t,a,st)=>grp(t,rows(g,a,st),`<button type=button data-ok=${g}>Vse v redu</button>`);
const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
document.title=C.naziv;$('#t').textContent=C.naziv;

$('#app').innerHTML=`
<div id=last hidden></div>
${grp('Vozilo in ekipa',sel('v','Vozilo',C.vozila,q.get('v'),1)+sel('p','Predal',C.zaposleni,'',1)+sel('r','Prevzel',C.zaposleni,'',1)+sel('i','Izmena',C.izmene)+`<label class=cell><span>Datum in ura</span><input id=t2 type=datetime-local value="${now}"></label>`)}
${grp('Stanje vozila',`<label class=cell><span>Kilometri</span><input id=km type=number inputmode=numeric min=0 placeholder="km"></label>`+seg('Gorivo','gor',C.gorivo)+C.kisik.map(x=>`<label class=cell><span>Kisik: ${esc(x)}</span><input type=number inputmode=numeric min=0 data-k="${esc(x)}" placeholder="bar"></label>`).join('')+seg('Čistoča','cis',C.cistoca,C.cistoca[0]))}
${sect('z','Zdravila',C.zdravila,C.stanjaZdravila)}
${sect('o','Oprema',C.oprema,C.stanjaOprema)}
${grp('Poškodbe ali okvare vozila','<textarea id=pos placeholder="Neobvezno"></textarea>')}
${grp('Ostale posebnosti','<textarea id=pb placeholder="Neobvezno"></textarea>')}
<p class=note id=st></p>
<div class=bar><button class=btn id=send type=button>Potrdi predajo</button></div>`;

const msg=(t,e)=>{const m=$('#toast');m.textContent=t;m.className=e?'err':'';m.style.display='block';setTimeout(()=>m.style.display='none',3500)};
const Q=()=>{try{return JSON.parse(localStorage.q||'[]')}catch(e){return[]}};
let lastKm=0;

function collect(){
  const g=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value||'';
  const iss=n=>{const a=$$(`[data-g=${n}]`).filter(s=>s.selectedIndex>0).map(s=>s.dataset.n+': '+s.value);return a.length?a.join('; '):'Vse v redu'};
  return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),k:C.KLJUC,cas:$('#t2').value,vozilo:$('#v').value,predal:$('#p').value,prevzel:$('#r').value,izmena:$('#i').value,km:+$('#km').value,gorivo:g('gor'),kisik:$$('[data-k]').map(i=>i.dataset.k+': '+(i.value||'?')+' bar').join('; '),zdravila:iss('z'),oprema:iss('o'),cistoca:g('cis'),poskodbe:$('#pos').value.trim(),posebnosti:$('#pb').value.trim()};
}

async function flush(){
  if(!C.SHEET_URL)return;
  const a=Q();
  while(a.length){
    try{await fetch(C.SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(a[0])});a.shift();localStorage.q=JSON.stringify(a)}catch(e){break}
  }
  if($('#st'))$('#st').textContent=a.length?`Čaka na pošiljanje: ${a.length}`:'';
}

async function last(){
  const v=$('#v').value,box=$('#last');lastKm=0;box.hidden=true;
  if(!v||!C.SHEET_URL)return;
  try{
    const r=await(await fetch(`${C.SHEET_URL}?v=${encodeURIComponent(v)}&k=${encodeURIComponent(C.KLJUC)}`)).json();
    if(r.km){lastKm=+r.km;box.hidden=false;box.innerHTML=grp('Zadnja predaja',`<div class=blk><div>${esc(r.km)} km · gorivo ${esc(r.gorivo)}</div><div class=sec>${esc(r.cas)} · prevzel ${esc(r.prevzel)}</div>${r.posebnosti?`<div style="margin-top:8px">${esc(r.posebnosti)}</div>`:''}</div>`)}
  }catch(e){}
}

const sub=()=>$('#sub').textContent=$('#v').value||'Izberi vozilo';
$('#app').addEventListener('change',e=>{const s=e.target;if(s.dataset.g)s.closest('.row').classList.toggle('bad',s.selectedIndex>0)});
$$('[data-ok]').forEach(b=>b.onclick=()=>$$(`[data-g=${b.dataset.ok}]`).forEach(s=>{s.selectedIndex=0;s.closest('.row').classList.remove('bad')}));
$('#v').onchange=()=>{sub();last()};

$('#send').onclick=async()=>{
  const o=collect();
  if(!o.vozilo||!o.predal||!o.prevzel||!o.km||!o.gorivo)return msg('Izpolni vozilo, predal, prevzel, kilometre in gorivo.',1);
  if(o.predal===o.prevzel)return msg('Predal in prevzel ne smeta biti ista oseba.',1);
  if(lastKm&&o.km<lastKm&&!confirm(`Kilometri (${o.km}) so manjši od zadnje predaje (${lastKm}). Vseeno nadaljujem?`))return;
  const a=Q();a.push(o);localStorage.q=JSON.stringify(a);
  await flush();
  const w=Q().length;
  $('#sub').textContent='';
  $('#app').innerHTML=`<div class=done><div class=ck>✓</div><h2>Predaja zabeležena</h2><p>${esc(o.vozilo)}</p><p class=sec>${esc(o.predal)} → ${esc(o.prevzel)}</p><p class="sec" style="margin-top:16px;font-size:15px">${C.SHEET_URL?(w?'Ni povezave. Pošlje se samodejno, ko bo na voljo.':'Poslano.'):'Shranjeno samo v tem telefonu.'}</p></div><div class=bar style="margin-top:48px"><button class=btn onclick=location.reload()>Nova predaja</button></div>`;
  scrollTo(0,0);
};

addEventListener('online',flush);flush();sub();last();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
